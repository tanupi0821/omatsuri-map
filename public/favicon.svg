<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="お祭りマップ">
  <!--
    検索結果には 16〜24px で出る。**「祭」の漢字は小さすぎて潰れる**ので、
    形で分かる提灯にした。サイトの地の色（藍）に、提灯の灯（生成り→橙→茜）。
    ヘッダの提灯の列・バナーの縁日と同じ言語なので、並べて見たときに揃う。
  -->
  <defs>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d2"/>
      <stop offset=".5" stop-color="#f5ab45"/>
      <stop offset="1" stop-color="#b02730"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#1e3f66"/>
  <!-- 吊り紐 -->
  <path d="M32 6v6" stroke="#e8d5b0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 口金（上） -->
  <rect x="25" y="11" width="14" height="5" rx="1.5" fill="#3a2a18"/>
  <!-- 火袋 -->
  <ellipse cx="32" cy="34" rx="17" ry="19" fill="url(#hi)"/>
  <!-- 横の骨。提灯だと分かる決め手 -->
  <g stroke="#00000033" stroke-width="1.6" stroke-linecap="round">
    <path d="M17 28h30"/>
    <path d="M15 34h34"/>
    <path d="M17 40h30"/>
  </g>
  <!-- 口金（下） -->
  <rect x="25" y="51" width="14" height="5" rx="1.5" fill="#3a2a18"/>
</svg>
