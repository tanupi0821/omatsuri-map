    note: 8月11日（火・祝）〜15日（土）の5日間。11日はアスティとくしまでの前夜祭（12:00・15:30・19:00の3回）。12日〜15日は有料演舞場（藍場浜・南内町・紺屋町）が二部入替制で1部18:00〜19:40、2部20:20〜22:00。選抜阿波おどりはあわぎんホールで各日11:00・13:30・16:00。無料演舞場は両国本町・電脳交通・新町橋東・両国橋南。データは端の2日しか持っていなかった
